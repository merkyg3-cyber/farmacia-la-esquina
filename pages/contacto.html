
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Farmacia La Esquina</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/main.js" defer></script>
</head>
<body>

<header class="encabezado">
    <div class="logo">
        <span>✚</span>
        <h2>Farmacia La Esquina</h2>
    </div>

    <nav>
        <a href="../index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="servicios.html">Servicios</a>
        <a class="activo" href="contacto.html">Contacto</a>
    </nav>
</header>

<section class="titulo-pagina">
    <h1>Contáctanos</h1>
    <p>Estamos aquí para escucharte.</p>
</section>

<main class="seccion">

    <form id="formulario" class="formulario">

        <h2>Envíanos un mensaje</h2>

        <label for="nombre">Nombre completo:</label>
        <input
            type="text"
            id="nombre"
            placeholder="Escribe tu nombre"
            required
            minlength="2"
        >

        <label for="correo">Correo electrónico:</label>
        <input
            type="email"
            id="correo"
            placeholder="ejemplo@gmail.com"
            required
        >

        <label for="asunto">Asunto:</label>
        <select id="asunto" required>
            <option value="">Selecciona una opción</option>
            <option>Consulta de productos</option>
            <option>Información de servicios</option>
            <option>Otra consulta</option>
        </select>

        <label for="texto">Mensaje:</label>
        <textarea
            id="texto"
            placeholder="Escribe tu mensaje..."
            required
            minlength="10"
        ></textarea>

        <button class="btn-formulario" type="submit">
            Enviar mensaje
        </button>

        <p id="mensaje"></p>

    </form>

</main>

<footer>
    <h3>Farmacia La Esquina</h3>
    <p>Teléfono: 809-555-0147 (demostración)</p>
    <p>© 2026 Todos los derechos reservados.</p>
</footer>

</body>
</html>
